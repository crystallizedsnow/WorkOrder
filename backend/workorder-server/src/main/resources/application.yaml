mybatis-plus:
    configuration:
        log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
        log-prefix: "[SQL Log] "
    global-config:
        db-config:
            logic-delete-field: deleted
            logic-delete-value: 1
            logic-not-delete-value: 0
    type-aliases-package: com.example.spring_vue_demo.entity

server:
    port: 8080

workorder:
    auth:
        # 仅用于本地开发。部署到共享或生产环境前应改用密钥管理或环境变量注入。
        jwt-secret: local-dev-workorder-jwt-secret-2026-change-before-production
        issuer: workorder-backend
        audience: workorder-api
        access-ttl: 15m
        refresh-ttl: 30d
        binding-code-ttl: 5m
        channel-access-ttl: 5m
        binding-max-attempts: 5
        # 仅用于本地开发，必须与 AiAssistant 的配置一致。
        channel-service-key: local-dev-aiassistant-channel-service-key-2026

spring:
    datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost/wos?useUnicode=true&characterEncoding=UTF-8
        username: root
        password: 123456
    elasticsearch:
            uris: https://localhost:9200
            connection-timeout: 5s
            socket-timeout: 30s
    ai:
        mcp:
            server:
                enabled: true
                name: test_mcp_server
                version: 1.0.0
                protocol: STREAMABLE
#                sse-endpoint: /api/v1/sse
#                sse-message-endpoint: /api/v1/mcp
                streamable-http:
                    mcp-endpoint: /api/v1/mcp
                    keep-alive-interval: 30s
                capabilities:
                    tool: true


canal:
    host: 127.0.0.1
    port: 11111
    destination: example
    username: root
    password: 123456

logging:
    level:
        com.baomidou.mybatisplus: WARN
        org.apache.ibatis: WARN
        io.modelcontextprotocol: TRACE
        org.springframework.ai.mcp: TRACE
        org.springframework.ai.tool: DEBUG
    pattern:
        console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [%X{traceId}] - %msg%n"

knife4j:
    enable: true
    setting:
        language: zh_cn
